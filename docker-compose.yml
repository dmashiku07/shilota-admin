services:
  mongodb:
    image: mongo:7
    container_name: shilota-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: shilota-api
    restart: unless-stopped
    depends_on:
      - mongodb
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongodb:27017/shilota_db}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME}
      API_PORT: ${API_PORT:-3000}
      SOCKET_PORT: ${SOCKET_PORT:-8081}
      HTTPS_MODE: ${HTTPS_MODE:-disable}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      RUNTIME_API_URL: ${RUNTIME_API_URL:-/api}
      RUNTIME_SOCKET_URL: ${RUNTIME_SOCKET_URL:-/}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_LOGIN_CLIENT_ID: ${GOOGLE_LOGIN_CLIENT_ID:-}
      ENABLE_PHONE_VERIFICATION: ${ENABLE_PHONE_VERIFICATION:-false}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
      FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID:-}
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8081:8081"
    volumes:
      - media_data:/app/src/assets/media
      - uploads_data:/app/src/assets/uploads

volumes:
  mongo_data:
  media_data:
  uploads_data:
