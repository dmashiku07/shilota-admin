<div class="margin_top20">
  <div class="hor_padding15">
    <a routerLink="/signin">
      <div class="back_arrow align-middle padding_left15" id="backLink"></div>
    </a>
  </div>
  <h5 class="heading pt-2">{{ 'Forgot Password' | translate }}</h5>
</div>
<form [formGroup]="passwordForm" class="form-profile margin_top15" novalidate
  (ngSubmit)="onProfileSubmit(passwordForm.value)">
  <div class="ride-review">
    <div class="hor_padding20 margin_top30">
      <div class="form-design">
        <div class="relPos upInputs">
          <input type="text" class="std-cod" [maxLength]="30" formControlName='email_id' id="email_id" #email_id
            required />
          <label class="upLabel mt-2">{{ 'Email' | translate }}</label>
        </div>
        <small class="text-danger"
          *ngIf="passwordForm.controls['email_id'].touched && !passwordForm.controls['email_id'].valid">
          {{ 'Email is required' | translate }}
        </small>
      </div>
    </div>
  </div>
  <div class="btn_div col-12 col-sm-12 col-md-12 col-lg-12 col-xl-4 hor_padding20">
    <input type="submit" class="btn btn_default full_width primary_clr_bg margin_top30" [disabled]="resetMail"
      value="{{ 'Reset' | translate }}">
  </div>
</form>
