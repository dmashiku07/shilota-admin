<div class="pt-3">
  <div class="hor_padding15">
    <a routerLink="/search">
      <div class="back_arrow align-middle" id="backLink"></div>
    </a>
  </div>
  <h5 class="heading pt-2">{{ 'Drop Location' | translate }}</h5>
</div>
<form [formGroup]="dropForm" novalidate (ngSubmit)="confirmLocation(dropForm.value)">
<div class=" hor_padding15">
  <div class="current_location1">
    <input type="text" (keydown.enter)="$event.preventDefault()" (keyup)="clearDrop();" name="drop_field" formControlName="drop_field" [(ngModel)]="drop_location" autocorrect="off"
      autocapitalize="off" spellcheck="off" class="enter_current padding_bottom10 login_form" placeholder="{{ 'DROP HERE' | translate }}"
      #drop_field>
    <small class="text-danger"
      *ngIf="dropForm.controls['drop_field'].touched && !dropForm.controls['drop_field'].valid">
      {{ 'Drop Location is required' | translate }}
    </small>
    <div>
      <div class="height-75vh pt-3" width="600">
        <agm-map [latitude]="latitude" [longitude]="longitude" [zoom]="zoom">
          <agm-marker [latitude]="latitude" [longitude]="longitude" [markerDraggable]="true"
            (dragEnd)="markerDragEnd($event)"></agm-marker>
        </agm-map>
      </div>
    </div>
  </div>
</div>
<div class="hor_padding15 btn_div col-12 col-sm-12 col-md-12 col-lg-12 col-xl-4" id="btn_bottom">
  <button type="submit" [disabled]="dropSelected" class="btn btn_default full_width primary_clr_bg">{{ 'Confirm Location' | translate }}</button>
</div>
</form>
