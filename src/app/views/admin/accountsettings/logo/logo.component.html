<div class="row">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <h4 class="card-title" id="basic-layout-form">Logo Setting</h4>
      </div>
      <div class="card-body">
        <div class="px-3">
          <div *ngIf="loading" class="text-center py-4">
            <i class="fa fa-spinner fa-spin mr-2"></i>
            Loading logo settings...
          </div>
          <form *ngIf="!loading && Form" class="form" [formGroup]="Form" novalidate (ngSubmit)="addLogo(Form.value)">
            <div class="col-md-12">
              <div class="form-group">
                <label for="projectinput3">Logo</label>
                <input type="file" id="logo" name="logo" class="form-control browse_btnn" formControlName="logo"
                  #logo />
                <p *ngIf="Form.controls['logo'].touched && !Form.controls['logo'].valid" class="error-msg">
                  <span *ngIf="Form.controls['logo'].hasError('required') ">
                    Logo is required
                  </span>
                </p>
              </div>
            </div>
            <div class="col-md-12">
              <div class="form-group">
                <img src="{{this.url}}/assets/uploads/{{users.logo}}" width="200" height="auto" *ngIf="users.logo">
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-raised btn-raised btn-primary" [disabled]="isLoading">
                <i *ngIf="!isLoading" class="fa fa-check-square-o"></i>
                <i *ngIf="isLoading" class="fa fa-spinner fa-spin"></i>
                {{ isLoading ? 'Saving...' : 'Save' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
