<section id="extended">
    <div class="row">
        <div class="col-sm-12">
            <div class="card">

                <div class="card-header">

                    <div class="actions float-right">
                        <a [routerLink]="['/admin/faq/add']">
                            <span data-i18n="" class="btn btn-raised btn-dark btn-sm ">
                                <i class="fa fa-plus"></i>&nbsp;Add Faq</span>
                        </a>
                    </div>
                    <h4 class="card-title">Faq Management</h4>
                </div>
                <div class="card-body">
                    <div class="card-block">
                        <table class="table table-responsive-md table-bordered table-striped table-inverse">
                            <thead>
                                <tr>
                                    <th style="width:5%">#</th>

                                    <th style="width: 75%;">Title</th>

                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngIf="loading">
                                    <td colspan="3" style="text-align:center;">
                                        <i class="fa fa-spinner fa-spin mr-2"></i>
                                        Loading FAQs...
                                    </td>
                                </tr>
                                <tr *ngFor="let page of faq; let i = index">
                                    <td>{{i + 1}}</td>

                                    <td>{{page.title}}</td>
                                    <td>

                                        <a class="btn btn-raised btn-icon btn-success mr-1" [routerLink]="['/admin/faq/edit',page._id]">
                                            <i class="fa fa-pencil"></i>
                                        </a>

                                        <a class="btn btn-raised btn-icon btn-danger mr-1 white" (click)="delete(page._id)">
                                            <i class="fa fa-trash-o"></i>
                                        </a>
                                    </td>
                                </tr>
                                <tr *ngIf="!loading && faq.length === 0">
                                    <td colspan="3" style="text-align:center;">No result found</td>
                                </tr>

                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
