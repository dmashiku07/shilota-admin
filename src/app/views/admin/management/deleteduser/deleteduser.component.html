<section id="base-style">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <h4 class="card-title">Deleted Users Management</h4>
        </div>
        <div class="card-body collapse show">
          <div class="card-block card-dashboard">
            <div class="actions float-left dataTables_filter">
              <input class="form-control form-control-sm" type="text" name="search" [(ngModel)]="filter" (ngModelChange)="onFilterChange()"
                placeholder="Search">
              <br>
            </div>
            <table class="table table-striped table-responsive-md table-bordered base-style">
              <thead>
                <tr>
                  <th>#</th>
                  <th (click)="sort('full_name')">Name
                    <span class="ft-arrow-up" *ngIf="key =='full_name'"
                      [ngClass]="{'ft-arrow-up':reverse,'ft-arrow-down':!reverse}"></span>
                  </th>
                  <th>Email
                    <span class="ft-arrow-up" *ngIf="key =='email'"
                      [ngClass]="{'ft-arrow-up':reverse,'ft-arrow-down':!reverse}"></span>
                  </th>
                  <th>Phone Number</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngIf="loading">
                  <td colspan="5" style="text-align:center;">
                    <i class="fa fa-spinner fa-spin mr-2"></i>
                    Loading deleted users...
                  </td>
                </tr>
                <tr *ngFor="let page of pages; let i = index;">
                  <td>{{rowNumber(i)}}</td>
                  <td>{{page.full_name | lowercase}}</td>
                  <td>{{page.email | lowercase}}</td>
                  <td>{{page.phone_number}}</td>
                  <td>
                    <button class="btn btn-raised btn-success" (click)="revoke(page._id)" *ngIf="page.deletion_status==1">
                      Revoke</button>
                  </td>
                </tr>
                <tr *ngIf="!loading && pages.length === 0 ">
                  <td colspan="5" style="text-align:center;">No result found</td>
                </tr>
              </tbody>
            </table>
            <app-server-pagination
              [page]="pagination.page"
              [pageSize]="pagination.pageSize"
              [totalPages]="pagination.totalPages"
              [totalItems]="pagination.totalItems"
              (pageChange)="onPageChange($event)">
            </app-server-pagination>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
