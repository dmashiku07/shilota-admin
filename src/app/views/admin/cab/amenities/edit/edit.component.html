<div class="row">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <h4 class="card-title" id="basic-layout-form">Edit Amenities</h4>
      </div>
      <div class="card-body">
        <div class="px-3">
          <form class="form" [formGroup]="Form" novalidate (ngSubmit)="update(Form.value)">
            <div class="col-md-12">
              <div class="form-group">
                <label for="projectinput3">Title</label>
                <input type="text" class="form-control" [maxlength]="30" formControlName="name" #name
                  [(ngModel)]="amenities.name" />
                <p *ngIf="Form.controls['name'].touched && !Form.controls['name'].valid" class="error-msg">
                  <span *ngIf="Form.controls['name'].hasError('required') ">
                    Title is required
                  </span>
                  <span *ngIf="Form.controls['name'].hasError('minlength') ">
                    Title must have 3 characters length.
                  </span>
                  <span *ngIf="Form.controls['name'].hasError('maxlength') ">
                    Title with in 30 characters length.
                  </span>
                </p>
              </div>
            </div>
            <div class="col-md-12">
              <div class="form-group">
                <label for="projectinput3">Image</label>
                <input type="file" id="image" name="image" class="form-control browse_btnn" formControlName="image"
                  #image [(ngModel)]="amenities.image" />
                <p *ngIf="Form.controls['image'].touched && !Form.controls['image'].valid" class="error-msg">
                  <span *ngIf="Form.controls['image'].hasError('required') ">
                    Image is required
                  </span>
                </p>
              </div>
            </div>
            <div class="col-md-12">
              <div class="form-group">
                <img src="{{this.url}}/assets/uploads/{{amenities.image}}" width="200" height="auto"
                  *ngIf="amenities.image">
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-raised btn-raised btn-primary">
                <i class="fa fa-check-square-o"></i> Update
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
