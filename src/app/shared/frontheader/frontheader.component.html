<div class="homepage overlay_div" (click)="closeNav()"></div>
<header class="front-shell">
  <nav class="front-nav" id="custom-nav" role="navigation">
    <div class="container front-nav__inner">
      <div class="front-nav__brand">
        <button type="button" class="menu_img front-nav__menu" (click)="openNav()" aria-label="Open menu">
          <img src="assets/img/nav.png" class="img-fluid" />
        </button>
        <a class="front-nav__logo" [routerLink]="['/']" *ngIf="logo; else textBrand">
          <img [src]="getUploadUrl(logo)" class="img-fluid" alt="Shilota logo" />
        </a>
        <ng-template #textBrand>
          <a class="front-nav__wordmark" [routerLink]="['/']">Shilota</a>
        </ng-template>
      </div>

      <div class="front-nav__links">
        <a routerLink="/search" class="front-nav__link front-nav__link--primary">{{ 'Book a Ride' | translate }}</a>
        <a routerLink="/faq" class="front-nav__link" *ngIf="faqCount != 0">{{ 'Help' | translate }}</a>
        <a routerLink="/signin" class="front-nav__link">{{ 'Sign In' | translate }}</a>
        <a routerLink="/notifications" class="front-nav__icon" aria-label="Notifications">
          <div class="notification nav_icons"></div>
        </a>
      </div>
    </div>
  </nav>
</header>
