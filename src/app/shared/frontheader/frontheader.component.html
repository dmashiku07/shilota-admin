<div class="homepage overlay_div" (click)="closeNav()"></div>
<header>
  <nav class="navbar header_bg padding15 web_menu fixed-top zindex66 border_bottom" id="custom-nav" role="navigation">
    <div class="container width_header">
      <div class="navbar-header pos_rel">
        <span class="menu_img" (click)="openNav()"><img src="assets/img/nav.png" class="img-fluid" /></span>
        <a class="navbar-brand logo_wdth ml-3" [routerLink]="['/home']" *ngIf="logo">
          <img [src]="getUploadUrl(logo)" class="img-fluid" alt="Logo" />
        </a>
      </div>
      <ul class="nav navbar-nav ml-auto front_nav_li">
        <li>
          <a routerLink="/faq" class="clr_black dis_none_mobile" *ngIf="faqCount != 0">{{ 'Help' | translate }}</a>
        </li>
        <li class="pos_rel notifi margin_right15min"><a routerLink="/notifications" class="clr_black">
            <div class="notification nav_icons "></div>
          </a></li>
      </ul>
      <!--/.nav-collapse -->
    </div>
    <!--/.container-fluid -->
  </nav>
</header>
